name: Step 1 official source probe
on:
  push:
    paths:
      - .github/workflows/step1_probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe NBA official L2M JSON and Play-In play-by-play
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          ua={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36","Referer":"https://official.nba.com/","Accept":"application/json, text/html;q=0.9, */*;q=0.8"}
          for gid in ("0052400121","0052400201","0022400064"):
            urls={
              "official_l2m":f"https://official.nba.com/l2m/json/{gid}.json",
              "cdn_pbp":f"https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_{gid}.json"
            }
            for kind,url in urls.items():
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=ua), timeout=15) as r:
                  body=r.read(4000000)
                obj=json.loads(body)
                if kind=="official_l2m":
                  print("RESULT",kind,gid,"OK",len(obj.get("l2m",[])),[list(obj.keys()),str(obj.get("l2m",[])[:1])[:400]])
                else:
                  print("RESULT",kind,gid,"OK",len(obj.get("game",{}).get("actions",[])))
              except urllib.error.HTTPError as e:
                print("RESULT",kind,gid,"HTTP",e.code,e.read(120)[:120])
              except Exception as e:
                print("RESULT",kind,gid,"ERROR",repr(e)[:220])
          PY
