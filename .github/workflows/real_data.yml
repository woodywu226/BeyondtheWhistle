name: Build and validate real NBA 2024-25 data
on:
  workflow_dispatch:
  push:
    paths:
      - src/beyond_the_whistle/build_archive_dataset.py
      - tests/test_real_dataset.py
      - .github/workflows/real_data.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
          ruff check .
      - name: Download and cross-check real datasets
        run: |
          python -m beyond_the_whistle.build_archive_dataset --season 2025
      - name: Confirm audit outputs
        run: |
          python - <<'PY'
          import csv,json
          p='data/validated/l2m_pbp_2025_audit.json'
          x=json.load(open(p))
          assert x['l2m_rows'] > 500, x
          assert x['metadata_consistent_games'] > 300, x
          assert sum(x['status_counts'].values()) == x['l2m_rows'], x
          with open('data/validated/l2m_pbp_2025_candidates.csv') as f:
              assert sum(1 for _ in csv.DictReader(f)) == x['l2m_rows']
          print('REAL DATA CHECK PASSED:',x['l2m_rows'],'L2M records,',x['metadata_consistent_games'],'metadata-aligned games')
          PY
      - name: Commit audited factual outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validated/l2m_pbp_2025_audit.json data/validated/l2m_pbp_2025_candidates.csv
          if ! git diff --cached --quiet; then
            git commit -m "data(step1): add real 2024-25 L2M-PBP candidate matches and audit"
            git push
          fi
